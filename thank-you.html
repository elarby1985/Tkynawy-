<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b2f5b" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Quotation Request Received | Tyknawy</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Inter", system-ui, sans-serif;
        color: #13243a;
        background: #f4f7fb;
      }
      .card {
        width: min(620px, 100%);
        padding: 42px;
        background: #fff;
        border: 1px solid #dce4ee;
        border-radius: 16px;
        text-align: center;
      }
      .logo {
        width: 70px;
        margin: 0 auto 24px;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        color: #fff;
        background: #164f93;
        border-radius: 50%;
        font-size: 24px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 14px;
        color: #072344;
        font-size: clamp(2rem, 6vw, 2.8rem);
        line-height: 1.12;
      }
      p {
        margin: 0 auto 24px;
        max-width: 52ch;
        color: #5d6b7d;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 20px;
        border: 1px solid #b8c7d9;
        border-radius: 8px;
        color: #0b2f5b;
        font-weight: 700;
        text-decoration: none;
      }
      .button.primary {
        border-color: #f5a000;
        background: #f5a000;
        color: #13243a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        class="logo"
        src="images/tyknawy-logo-header.png"
        alt="Tyknawy logo"
      />
      <div class="mark" aria-hidden="true">✓</div>
      <h1>Quotation request received.</h1>
      <p>
        Thank you for contacting Tyknawy for Contracting. Our team will review
        your project details and contact you using the information provided.
      </p>
      <div class="actions">
        <a class="button primary" href="/">Return to website</a
        ><a
          class="button"
          href="https://wa.me/97471040746"
          target="_blank"
          rel="noopener noreferrer"
          >Continue via WhatsApp</a
        >
      </div>
    </main>
  </body>
</html>
