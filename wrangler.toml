name = "tyknawy-cfm-secure"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tyknawy-cfm"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
